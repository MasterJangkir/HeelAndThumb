plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masterjangkir.touchracer'
    compileSdk 34

    defaultConfig {
        applicationId "com.masterjangkir.touchracer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TouchRacerEnhanced-v${defaultConfig.versionName}.apk"
        }
    }
}

dependencies {
}
